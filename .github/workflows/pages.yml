name: Publish frontend to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Read Pages origin and repository path
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify frontend
        run: npm test
      - name: Build public frontend
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # This endpoint is visible to browsers. It is not a credential.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = process.env.NEXT_PUBLIC_API_URL;
          if (endpoint) {
            let url;
            try { url = new URL(endpoint); } catch { throw new Error('Set NEXT_PUBLIC_API_URL to the public HTTPS API address.'); }
            if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) {
              throw new Error('NEXT_PUBLIC_API_URL must be a public HTTPS URL without credentials, query, or fragment.');
            }
          }
          NODE
          npm run build
      - name: Check public artifact boundaries
        run: |
          node --input-type=module <<'NODE'
          import { readdir } from 'node:fs/promises';
          import { join } from 'node:path';
          async function inspect(directory) {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.isSymbolicLink()) throw new Error('The public artifact must not contain symlinks.');
              if (/^(?:\.env(?:\..*)?|credentials?(?:\..*)?)$/i.test(entry.name) || /\.(?:db|sqlite3?|pem|key|p12|pfx)(?:-wal|-shm)?$/i.test(entry.name)) {
                throw new Error('A private configuration, credential, or database file was found in out/.');
              }
              if (entry.isDirectory()) await inspect(path);
            }
          }
          await inspect('out');
          NODE
      - name: Upload static frontend only
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
