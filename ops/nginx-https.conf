server {
    listen 80;
    server_name __PUBLIC_HOST__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sententia-acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name __PUBLIC_HOST__;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/sententia-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sententia-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SententiaTLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header Cache-Control "no-store" always;
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_hide_header Server;
    }
    location / { return 404; }
}
